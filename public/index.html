<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070C18">
<title>Milliy Pin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- Muhr: sakkiz qirrali girih yulduzi, ichida gumbaz va "MP" tamg'asi -->
  <g id="seal">
    <g class="rot" fill="none" stroke="currentColor" stroke-linejoin="round">
      <path stroke-width="1.6" d="M32 3 39.4 24.6 61 32 39.4 39.4 32 61 24.6 39.4 3 32 24.6 24.6Z"/>
      <rect stroke-width="1.1" x="13" y="13" width="38" height="38" transform="rotate(45 32 32)" opacity=".6"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="32" cy="32" r="12.4" opacity=".75"/>
      <path d="M27.4 37.6V26.4l4.6 6 4.6-6v11.2"/>
    </g>
  </g>
  <!-- Go'ri Amir gumbazi — balans kartasi va banner uchun -->
  <g id="dome" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
    <path d="M32 6c-9 6.4-14.4 14.2-14.4 22.4h28.8C46.4 20.2 41 12.4 32 6Z"/>
    <path d="M24.6 9.8c-2.2 5.8-3.4 12-3.4 18.6M39.4 9.8c2.2 5.8 3.4 12 3.4 18.6"/>
    <path d="M32 6V2"/>
    <path d="M15.2 28.4h33.6v6.8H15.2Z"/>
    <path d="M19.4 35.2V58h25.2V35.2"/>
    <path d="M10 58h44"/>
    <path d="M28.4 58V47.6a3.6 3.6 0 0 1 7.2 0V58"/>
  </g>
</defs></svg>

<div id="splash">
  <div class="sp-seal"><svg viewBox="0 0 64 64"><use href="#seal"/></svg></div>
  <div>
    <div class="sp-name center">Milliy Pin</div>
    <div class="sp-sub center">O'yin va raqamli xizmatlar</div>
  </div>
  <div class="sp-bar"><i></i></div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="tb-row">
      <div class="hi" id="hiBox"></div>
      <div class="tb-act">
        <button class="iconbtn" id="langBtn" type="button" title="Til">UZ</button>
        <button class="iconbtn" id="themeBtn" type="button" title="Ko'rinish"></button>
      </div>
    </div>
  </header>
  <div class="band" aria-hidden="true"></div>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar"><span class="tabpill" id="tabpill"></span></nav>
</div>

<div id="sheetWrap" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sh-head">
      <div class="sh-grab" data-close></div>
      <div class="sh-bar">
        <h2 class="sh-title" id="sheetTitle"></h2>
        <button class="sh-x" type="button" data-close aria-label="Yopish" id="sheetX"></button>
      </div>
      <div class="sh-band" aria-hidden="true"></div>
    </div>
    <div class="sh-body" id="sheetBody"></div>
  </div>
</div>

<div id="askWrap" hidden>
  <div class="scrim" data-askno></div>
  <div class="ask" role="dialog" aria-modal="true">
    <div class="ask-t" id="askTitle"></div>
    <div class="ask-s" id="askText" hidden></div>
    <input class="input" id="askInput" autocomplete="off" hidden>
    <div class="ask-a">
      <button class="btn btn--line btn-1" type="button" id="askNo" data-askno></button>
      <button class="btn btn--acc btn-1" type="button" id="askYes"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/icons.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/admin.js"></script>
</body>
</html>
