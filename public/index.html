<!doctype html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F3EADA">
<title>Milliy Pin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ══ Muhr: sakkiz qirrali girih yulduzi, ichida "MP" tamg'asi ══ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="seal">
    <g class="rot" fill="none" stroke="currentColor" stroke-linejoin="round">
      <path stroke-width="1.6" d="M32 3 39.4 24.6 61 32 39.4 39.4 32 61 24.6 39.4 3 32 24.6 24.6Z"/>
      <rect stroke-width="1.1" x="13" y="13" width="38" height="38" transform="rotate(45 32 32)" opacity=".62"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="32" cy="32" r="12.4" opacity=".8"/>
      <path d="M27.4 37.6V26.4l4.6 6 4.6-6v11.2"/>
    </g>
  </g>
</defs></svg>

<div id="splash">
  <div class="sp-seal"><svg viewBox="0 0 64 64"><use href="#seal"/></svg></div>
  <div>
    <div class="sp-name center">Milliy Pin</div>
    <div class="sp-sub center">Telegram va o'yin donatlari</div>
  </div>
  <div class="sp-bar"><i></i></div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="tb-row">
      <div class="mark">
        <span class="mark-seal"><svg viewBox="0 0 64 64"><use href="#seal"/></svg></span>
        <span class="mark-txt">
          <span class="mark-name">Milliy Pin</span>
          <span class="mark-sub" id="markSub">Donat xizmati</span>
        </span>
      </div>
      <div class="tb-act">
        <button class="bal-pill" id="balPill" type="button">
          <span id="balIco"></span><span class="num" id="balVal">0</span><span class="cur">so'm</span>
        </button>
        <button class="iconbtn" id="langBtn" type="button" title="Til">UZ</button>
        <button class="iconbtn" id="themeBtn" type="button" title="Ko'rinish"></button>
      </div>
    </div>
  </header>
  <div class="band" aria-hidden="true"></div>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <span class="tabpill" id="tabpill"></span>
  </nav>
</div>

<div id="sheetWrap" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sh-head">
      <div class="sh-grab" data-close></div>
      <div class="sh-bar">
        <h2 class="sh-title" id="sheetTitle"></h2>
        <button class="sh-x" type="button" data-close aria-label="Yopish" id="sheetX"></button>
      </div>
      <div class="sh-band" aria-hidden="true"></div>
    </div>
    <div class="sh-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/icons.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/admin.js"></script>
</body>
</html>
